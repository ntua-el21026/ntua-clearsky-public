
services:
  # Users Database (MariaDB)

  api-gateway:
    ports:
      - "127.0.0.1:8080:8080"
    build:
      context: ./api_gateway
    environment:
      - INTERNAL_GATEWAY_TOKEN=${INTERNAL_GATEWAY_TOKEN:?Set INTERNAL_GATEWAY_TOKEN}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      - users-service
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./api_gateway:/usr/src/app
      - /usr/src/app/node_modules  


  
  users-db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - MYSQL_DATABASE=clearSKY_users
    volumes:
      - ./user_management_microservice/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - users_db_data:/var/lib/mysql

  # User Management Microservice
  users-service:
    build: 
      context: ./user_management_microservice
      dockerfile: Dockerfile
    restart: always
    environment:
      - INTERNAL_GATEWAY_TOKEN=${INTERNAL_GATEWAY_TOKEN:?Set INTERNAL_GATEWAY_TOKEN}
      - DB_HOST=users-db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_NAME=clearSKY_users
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      - users-db
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./user_management_microservice:/usr/src/app
      - /usr/src/app/node_modules

  # Grades Microservice (Initial Grades)
  grades-db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - MYSQL_DATABASE=clearSKY_grades
    volumes:
      - ./grades_management_microservice/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - grades_db_data:/var/lib/mysql

  grades-service:
    build:
      context: ./grades_management_microservice
      dockerfile: Dockerfile
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - INTERNAL_GATEWAY_TOKEN=${INTERNAL_GATEWAY_TOKEN:?Set INTERNAL_GATEWAY_TOKEN}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?Set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq
      - DB_HOST=grades-db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_NAME=clearSKY_grades
      - DB_PORT=3306
    depends_on:
      - grades-db
      - rabbitmq
    command: npm start
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./grades_management_microservice:/usr/src/app
      - /usr/src/app/node_modules

  review-db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - MYSQL_DATABASE=clearSKY_reviews
    volumes:
      - ./review_management_microservice/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - review_db_data:/var/lib/mysql

  review-service:
    build:
      context: ./review_management_microservice
      dockerfile: Dockerfile
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - INTERNAL_GATEWAY_TOKEN=${INTERNAL_GATEWAY_TOKEN:?Set INTERNAL_GATEWAY_TOKEN}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?Set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq
      - DB_HOST=review-db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_NAME=clearSKY_reviews
      - DB_PORT=3306
    depends_on:
      - review-db
      - rabbitmq
    command: npm start
    volumes:
      - ./shared:/usr/src/shared:ro
      - ./review_management_microservice:/usr/src/app
      - /usr/src/app/node_modules


  # Frontend Service (e.g., React, Vite)
  frontend:
    ports:
      - "127.0.0.1:5173:5173"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  users_db_data:
  grades_db_data:
  review_db_data:
  rabbitmq_data:
